<!DOCTYPE html>
<html>
  <head>
    <title>JavaScript Injector</title>
  </head>
  <body>
    <div
      id="JavaScriptInjectorConfigPage"
      data-role="page"
      class="page type-interior pluginConfigurationPage"
    >
      <div data-role="content">
        <div class="content-primary">
          <form id="JavaScriptInjectorConfigForm">
            <div class="verticalSection verticalSection-extrabottompadding">
              <div class="sectionTitleContainer flex align-items-center">
                <h2 class="sectionTitle">JavaScript Injector</h2>
                <a
                  is="emby-linkbutton"
                  class="raised raised-mini emby-button"
                  style="margin-left: 2em"
                  target="_blank"
                  href="https://github.com/n00bcodr/Jellyfin-JavaScript-Injector"
                >
                  <i class="md-icon button-icon button-icon-left secondaryText"></i>
                  <span>Help</span>
                </a>
              </div>
              <hr />
              <br />
              <div class="verticalSection" style="display: flex; gap: 1em; align-items: center; flex-wrap: wrap; margin-bottom: 1.5em;">
                <div class="inputContainer" style="flex: 1; min-width: 200px; margin: 0">
                  <input
                    is="emby-input"
                    type="text"
                    id="scriptSearchInput"
                    label="Search Scripts:"
                    placeholder="Filter by name..."
                  />
                </div>
              </div>

              <div id="scriptsContainer" class="verticalSection-extrabottompadding">
                <!-- User script entries will be dynamically inserted here -->
              </div>

              <div
                id="noScriptsMessage"
                style="display: none; color: #888; text-align: center; padding: 2em 1em"
              ></div>

              <div class="verticalSection" style="display: flex; gap: 0.75em; flex-wrap: wrap">
                <button
                  is="emby-button"
                  type="button"
                  id="addScriptBtn"
                  class="raised button-submit block"
                  style="flex: 1; min-width: 160px"
                >
                  <span>Add Script</span>
                </button>
                <button
                  is="emby-button"
                  type="button"
                  id="exportScriptsBtn"
                  class="raised block"
                  style="flex: 1; min-width: 160px"
                >
                  <span>Export All</span>
                </button>
                <button
                  is="emby-button"
                  type="button"
                  id="importScriptsBtn"
                  class="raised block"
                  style="flex: 1; min-width: 160px"
                >
                  <span>Import</span>
                </button>
                <input
                  type="file"
                  id="importScriptsFile"
                  accept="application/json"
                  style="display: none"
                />
              </div>

              <!-- Plugin Scripts Section -->
              <div id="pluginScriptsSection" class="verticalSection" style="display: none">
                <h3 class="sectionTitle">Plugin Scripts</h3>
                <p style="color: #888; margin-bottom: 1em">
                  These scripts were added by other plugins and cannot be edited here. You can only
                  view or delete them.
                </p>
                <div id="pluginScriptsContainer" class="verticalSection-extrabottompadding">
                  <!-- Plugin script entries will be dynamically inserted here -->
                </div>
              </div>
              <br />
              <div
                style="
                  background-color: rgba(255, 255, 255, 0.05);
                  border-left: 4px solid #00a4dc;
                  border-radius: 4px;
                  padding: 1em 1.5em;
                  margin: 1.5em 0;
                  display: flex;
                  align-items: center;
                  gap: 1em;
                "
              >
                <i class="material-icons" style="color: #00a4dc; font-size: 24px">info</i>
                <div>
                  Changes require a browser refresh to take effect. <br />
                  Scripts marked with 'Requires Authentication' will only be loaded for
                  authenticated users.
                </div>
              </div>
              <div
                id="sanitizeNotice"
                style="
                  display: none;
                  background-color: rgba(255, 193, 7, 0.12);
                  border-left: 4px solid #ffc107;
                  border-radius: 4px;
                  color: inherit;
                  margin: 1em 0;
                  padding: 1em 1.25em;
                "
              ></div>
              <br />
              <div>
                <button is="emby-button" type="submit" class="raised button-submit block">
                  <span>Save</span>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <template id="script-entry-template">
        <details
          class="verticalSection"
          style="
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 1em;
          "
        >
          <summary
            style="
              cursor: pointer;
              list-style: none;
              display: flex;
              align-items: center;
              justify-content: space-between;
              padding: 0.75em 1em;
            "
          >
            <div style="display: flex; align-items: center;">
              <i
                class="material-icons drag-handle"
                style="cursor: grab; color: #888; margin-right: 0.25em"
                title="Drag to reorder"
                >drag_indicator</i
              >
              <i class="material-icons arrow-icon" style="transition: transform 0.2s ease-in-out"
                >arrow_right</i
              >
              <h3 class="sectionTitle script-name-header" style="margin: 0 0 0 0.5em"></h3>
            </div>
            <div class="script-quick-actions" style="display: flex; align-items: center; gap: 0.5em;">
              <button
                is="emby-button"
                type="button"
                class="script-quick-export-btn"
                style="
                  background: none;
                  border: none;
                  padding: 0.25em;
                  min-height: auto;
                  color: #888;
                "
                title="Export as .js"
              >
                <i class="material-icons" style="font-size: 20px;">file_download</i>
              </button>
              <button
                is="emby-button"
                type="button"
                class="script-quick-enable-btn"
                style="
                  background: none;
                  border: none;
                  padding: 0.25em;
                  min-height: auto;
                  color: #52b54b;
                "
                title="Toggle Enable/Disable"
              >
                <i class="material-icons" style="font-size: 20px;">check_box</i>
              </button>
              <button
                is="emby-button"
                type="button"
                class="script-quick-remove-btn"
                style="
                  background: none;
                  border: none;
                  padding: 0.25em;
                  min-height: auto;
                  color: #cc3333;
                "
                title="Remove Script"
              >
                <i class="material-icons" style="font-size: 20px;">delete</i>
              </button>
            </div>
          </summary>
          <div
            class="script-container"
            style="padding: 1.5em; border-top: 1px solid rgba(255, 255, 255, 0.1)"
          >
            <div class="inputContainer">
              <input is="emby-input" type="text" class="script-name-input" label="Script Name:" />
            </div>
            <div class="inputContainer">
              <textarea
                class="script-code-textarea emby-textarea emby-input"
                style="height: 300px; width: 100%"
                placeholder="// Insert your custom JavaScript code here..."
              ></textarea>
            </div>
            <div style="display: flex; align-items: center; gap: 2em; margin-top: 1em">
              <label class="emby-checkbox-label">
                <input is="emby-checkbox" type="checkbox" class="script-enabled-checkbox" />
                <span>Enabled</span>
              </label>
              <label class="emby-checkbox-label">
                <input is="emby-checkbox" type="checkbox" class="script-auth-checkbox" />
                <span>Requires Authentication</span>
              </label>
              <button is="emby-button" type="button" class="raised button-delete script-remove-btn">
                <span>Remove</span>
              </button>
            </div>
          </div>
        </details>
      </template>

      <template id="plugin-script-entry-template">
        <details
          class="verticalSection"
          style="
            background-color: rgba(255, 193, 7, 0.1);
            border-left: 4px solid #ffc107;
            border-radius: 8px;
            margin-bottom: 1em;
          "
        >
          <summary
            style="
              cursor: pointer;
              list-style: none;
              display: flex;
              align-items: center;
              justify-content: space-between;
              padding: 0.75em 1em;
            "
          >
            <div style="display: flex; align-items: center;">
              <i class="material-icons arrow-icon" style="transition: transform 0.2s ease-in-out"
                >arrow_right</i
              >
              <h3 class="sectionTitle plugin-script-name-header" style="margin: 0 0 0 0.5em"></h3>
            </div>
            <div class="plugin-script-quick-actions" style="display: flex; align-items: center; gap: 0.5em;">
              <button
                is="emby-button"
                type="button"
                class="plugin-script-quick-export-btn"
                style="
                  background: none;
                  border: none;
                  padding: 0.25em;
                  min-height: auto;
                  color: #888;
                "
                title="Export as .js"
              >
                <i class="material-icons" style="font-size: 20px;">file_download</i>
              </button>
              <button
                is="emby-button"
                type="button"
                class="plugin-script-quick-enable-btn"
                style="
                  background: none;
                  border: none;
                  padding: 0.25em;
                  min-height: auto;
                  color: #52b54b;
                "
                title="Toggle Enable/Disable"
              >
                <i class="material-icons" style="font-size: 20px;">check_box</i>
              </button>
              <button
                is="emby-button"
                type="button"
                class="plugin-script-quick-remove-btn"
                style="
                  background: none;
                  border: none;
                  padding: 0.25em;
                  min-height: auto;
                  color: #cc3333;
                "
                title="Delete Script"
              >
                <i class="material-icons" style="font-size: 20px;">delete</i>
              </button>
            </div>
          </summary>
          <div
            class="plugin-script-container"
            style="padding: 1.5em; border-top: 1px solid rgba(255, 193, 7, 0.3)"
          >
            <div
              class="plugin-info"
              style="
                background-color: rgba(255, 193, 7, 0.05);
                border-radius: 4px;
                padding: 1em;
                margin-bottom: 1em;
              "
            >
              <h4 style="margin: 0 0 0.5em 0; color: #ffc107">Plugin Information</h4>
              <p style="margin: 0.25em 0">
                <strong>Plugin Name:</strong> <span class="plugin-name"></span>
              </p>
              <p style="margin: 0.25em 0">
                <strong>Plugin Version:</strong>
                <span class="plugin-version"></span>
              </p>
              <p style="margin: 0.25em 0">
                <strong>Script ID:</strong>
                <span class="plugin-script-id"></span>
              </p>
            </div>
            <div class="inputContainer">
              <textarea
                class="plugin-script-code-textarea emby-textarea emby-input"
                style="height: 300px; width: 100%"
                readonly
                placeholder="Script content will be displayed here..."
              ></textarea>
            </div>
            <div style="display: flex; align-items: center; gap: 2em; margin-top: 1em">
              <label class="emby-checkbox-label">
                <input is="emby-checkbox" type="checkbox" class="plugin-script-enabled-checkbox" />
                <span>Enabled</span>
              </label>
              <label class="emby-checkbox-label">
                <input
                  is="emby-checkbox"
                  type="checkbox"
                  class="plugin-script-auth-checkbox"
                  disabled
                />
                <span>Requires Authentication</span>
              </label>
              <button
                is="emby-button"
                type="button"
                class="raised button-delete plugin-script-remove-btn"
              >
                <span>Delete</span>
              </button>
            </div>
          </div>
        </details>
      </template>

      <script type="text/javascript">
        var JavaScriptInjectorConfig = {
          pluginId: "f5a34f7b-2e8a-4e6a-a722-3a216a81b374",
          isDirty: false,
          draggedElement: null,

          markDirty: function () {
            JavaScriptInjectorConfig.isDirty = true;
          },

          downloadTextFile: function (filename, content, mimeType) {
            const blob = new Blob([content], { type: mimeType || "text/plain" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
          },

          slugifyFilename: function (name) {
            const trimmed = (name || "script").trim();
            const slug = trimmed.replace(/[^a-z0-9\-_]+/gi, "_");
            return (slug || "script") + ".js";
          },

          updateEmptyState: function () {
            const scriptsContainer = document.querySelector("#scriptsContainer");
            const noScriptsMessage = document.querySelector("#noScriptsMessage");
            const searchTerm = document.querySelector("#scriptSearchInput").value.trim();
            const allEntries = Array.from(scriptsContainer.querySelectorAll(":scope > details"));
            const visibleEntries = allEntries.filter((el) => el.style.display !== "none");

            if (allEntries.length === 0) {
              noScriptsMessage.textContent = "No custom scripts yet. Click 'Add Script' to create one.";
              noScriptsMessage.style.display = "block";
            } else if (visibleEntries.length === 0 && searchTerm) {
              noScriptsMessage.textContent = "No scripts match \"" + searchTerm + "\".";
              noScriptsMessage.style.display = "block";
            } else {
              noScriptsMessage.style.display = "none";
            }
          },

          filterScripts: function () {
            const searchTerm = document
              .querySelector("#scriptSearchInput")
              .value.trim()
              .toLowerCase();
            const scriptsContainer = document.querySelector("#scriptsContainer");
            scriptsContainer.querySelectorAll(":scope > details").forEach((entry) => {
              const nameInput = entry.querySelector(".script-name-input");
              const name = (nameInput ? nameInput.value : "").toLowerCase();
              entry.style.display = !searchTerm || name.includes(searchTerm) ? "" : "none";
            });
            JavaScriptInjectorConfig.updateEmptyState();
          },

          getDragAfterElement: function (container, y) {
            const elements = Array.from(container.querySelectorAll(":scope > details")).filter(
              (el) => el !== JavaScriptInjectorConfig.draggedElement
            );
            return elements.reduce(
              (closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                  return { offset: offset, element: child };
                }
                return closest;
              },
              { offset: Number.NEGATIVE_INFINITY, element: null }
            ).element;
          },

          setupDragAndDrop: function (detailsElement, handle) {
            handle.addEventListener("mousedown", () => {
              detailsElement.draggable = true;
            });
            const resetDraggable = () => {
              detailsElement.draggable = false;
            };
            handle.addEventListener("mouseup", resetDraggable);
            detailsElement.addEventListener("dragend", () => {
              resetDraggable();
              detailsElement.style.opacity = "";
              JavaScriptInjectorConfig.draggedElement = null;
            });
            detailsElement.addEventListener("dragstart", (e) => {
              JavaScriptInjectorConfig.draggedElement = detailsElement;
              e.dataTransfer.effectAllowed = "move";
              detailsElement.style.opacity = "0.4";
            });
          },

          sanitizeForXml: function (text) {
            if (!text) {
              return "";
            }

            return text.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g, "");
          },

          showSanitizeNotice: function (changedScriptCount, changedScriptNames) {
            const notice = document.querySelector("#sanitizeNotice");

            if (!changedScriptCount) {
              notice.style.display = "none";
              notice.textContent = "";
              return;
            }

            const noun = changedScriptCount === 1 ? "script entry" : "script entries";
            const uniqueNames = [...new Set(changedScriptNames.filter((name) => !!name))];
            const listedNames = uniqueNames.length > 0 ? uniqueNames.join(", ") : "Unnamed Script";
            notice.textContent =
              "Sanitized XML-invalid control characters from " +
              changedScriptCount +
              " " +
              noun +
              " before saving. Affected scripts: " +
              listedNames +
              ".";
            notice.style.display = "block";
          },

          loadConfiguration: function () {
            Dashboard.showLoadingMsg();
            ApiClient.getPluginConfiguration(JavaScriptInjectorConfig.pluginId)
              .then(function (config) {
                const scriptsContainer = document.querySelector("#scriptsContainer");
                const pluginScriptsContainer = document.querySelector("#pluginScriptsContainer");
                const pluginScriptsSection = document.querySelector("#pluginScriptsSection");

                scriptsContainer.innerHTML = "";
                pluginScriptsContainer.innerHTML = "";

                // Load user scripts
                if (config.CustomJavaScripts && config.CustomJavaScripts.length > 0) {
                  config.CustomJavaScripts.forEach((script) => {
                    scriptsContainer.appendChild(
                      JavaScriptInjectorConfig.createScriptEntry(script)
                    );
                  });
                }

                // Load plugin scripts
                if (config.PluginJavaScripts && config.PluginJavaScripts.length > 0) {
                  config.PluginJavaScripts.forEach((script) => {
                    pluginScriptsContainer.appendChild(
                      JavaScriptInjectorConfig.createPluginScriptEntry(script)
                    );
                  });
                  pluginScriptsSection.style.display = "block";
                } else {
                  pluginScriptsSection.style.display = "none";
                }

                JavaScriptInjectorConfig.updateEmptyState();
                JavaScriptInjectorConfig.isDirty = false;
                Dashboard.hideLoadingMsg();
              })
              .catch(function () {
                Dashboard.hideLoadingMsg();
              });
          },

          createScriptEntry: function (script) {
            const template = document.querySelector("#script-entry-template");
            const clone = template.content.cloneNode(true);

            const detailsElement = clone.querySelector("details");
            const nameHeader = clone.querySelector(".script-name-header");
            const nameInput = clone.querySelector(".script-name-input");
            const codeTextarea = clone.querySelector(".script-code-textarea");
            const enabledCheckbox = clone.querySelector(".script-enabled-checkbox");
            const authCheckbox = clone.querySelector(".script-auth-checkbox");
            const removeBtn = clone.querySelector(".script-remove-btn");
            const arrowIcon = clone.querySelector(".arrow-icon");
            const dragHandle = clone.querySelector(".drag-handle");
            const quickEnableBtn = clone.querySelector(".script-quick-enable-btn");
            const quickRemoveBtn = clone.querySelector(".script-quick-remove-btn");
            const quickExportBtn = clone.querySelector(".script-quick-export-btn");

            // Populate the cloned template with script data
            nameHeader.textContent = script.Name;
            nameInput.value = script.Name;
            codeTextarea.value = script.Script;
            enabledCheckbox.checked = script.Enabled;
            authCheckbox.checked = script.RequiresAuthentication;

            // Update quick enable button icon based on enabled state
            const updateQuickEnableIcon = () => {
              const icon = quickEnableBtn.querySelector('.material-icons');
              if (enabledCheckbox.checked) {
                icon.textContent = 'check_box';
                quickEnableBtn.style.color = '#52b54b';
              } else {
                icon.textContent = 'check_box_outline_blank';
                quickEnableBtn.style.color = '#888';
              }
            };
            updateQuickEnableIcon();

            // Add event listeners
            nameInput.addEventListener("input", (e) => {
              nameHeader.textContent = e.target.value || "New Script";
              JavaScriptInjectorConfig.markDirty();
              JavaScriptInjectorConfig.filterScripts();
            });

            codeTextarea.addEventListener("input", JavaScriptInjectorConfig.markDirty);

            enabledCheckbox.addEventListener("change", () => {
              updateQuickEnableIcon();
              JavaScriptInjectorConfig.markDirty();
            });
            authCheckbox.addEventListener("change", JavaScriptInjectorConfig.markDirty);

            quickEnableBtn.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              enabledCheckbox.checked = !enabledCheckbox.checked;
              updateQuickEnableIcon();
              JavaScriptInjectorConfig.markDirty();
            });

            quickExportBtn.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              const scriptName = nameInput.value || script.Name || "script";
              JavaScriptInjectorConfig.downloadTextFile(
                JavaScriptInjectorConfig.slugifyFilename(scriptName),
                codeTextarea.value,
                "text/javascript"
              );
            });

            quickRemoveBtn.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              const scriptName = nameInput.value || script.Name || "New Script";
              if (confirm("Are you sure you want to remove the script \"" + scriptName + "\"?")) {
                detailsElement.remove();
                JavaScriptInjectorConfig.markDirty();
                JavaScriptInjectorConfig.updateEmptyState();
              }
            });

            removeBtn.addEventListener("click", () => {
              const scriptName = nameInput.value || script.Name || "New Script";
              if (confirm("Are you sure you want to remove the script \"" + scriptName + "\"?")) {
                detailsElement.remove();
                JavaScriptInjectorConfig.markDirty();
                JavaScriptInjectorConfig.updateEmptyState();
              }
            });

            // Handle arrow icon switching on toggle
            detailsElement.addEventListener("toggle", () => {
              arrowIcon.style.transform = detailsElement.open ? "rotate(90deg)" : "rotate(0deg)";
            });

            JavaScriptInjectorConfig.setupDragAndDrop(detailsElement, dragHandle);

            return clone;
          },

          createPluginScriptEntry: function (script) {
            const template = document.querySelector("#plugin-script-entry-template");
            const clone = template.content.cloneNode(true);

            const detailsElement = clone.querySelector("details");
            const nameHeader = clone.querySelector(".plugin-script-name-header");
            const codeTextarea = clone.querySelector(".plugin-script-code-textarea");
            const enabledCheckbox = clone.querySelector(".plugin-script-enabled-checkbox");
            const authCheckbox = clone.querySelector(".plugin-script-auth-checkbox");
            const removeBtn = clone.querySelector(".plugin-script-remove-btn");
            const arrowIcon = clone.querySelector(".arrow-icon");
            const pluginName = clone.querySelector(".plugin-name");
            const pluginVersion = clone.querySelector(".plugin-version");
            const pluginScriptId = clone.querySelector(".plugin-script-id");
            const quickEnableBtn = clone.querySelector(".plugin-script-quick-enable-btn");
            const quickRemoveBtn = clone.querySelector(".plugin-script-quick-remove-btn");
            const quickExportBtn = clone.querySelector(".plugin-script-quick-export-btn");

            // Populate the cloned template with script data
            nameHeader.textContent = script.Name;
            codeTextarea.value = script.Script;
            enabledCheckbox.checked = script.Enabled;
            authCheckbox.checked = script.RequiresAuthentication;
            pluginName.textContent = script.PluginName || "Unknown Plugin";
            pluginVersion.textContent = script.PluginVersion || "Unknown Version";
            pluginScriptId.textContent = script.Id || "Unknown ID";

            // Store the script ID for deletion
            detailsElement.setAttribute("data-script-id", script.Id);

            // Update quick enable button icon based on enabled state
            const updateQuickEnableIcon = () => {
              const icon = quickEnableBtn.querySelector('.material-icons');
              if (enabledCheckbox.checked) {
                icon.textContent = 'check_box';
                quickEnableBtn.style.color = '#52b54b';
              } else {
                icon.textContent = 'check_box_outline_blank';
                quickEnableBtn.style.color = '#888';
              }
            };
            updateQuickEnableIcon();

            // Add event listeners
            enabledCheckbox.addEventListener("change", () => {
              // Update the enabled state in the configuration immediately
              JavaScriptInjectorConfig.updatePluginScriptEnabled(
                script.Id,
                enabledCheckbox.checked
              );
              updateQuickEnableIcon();
            });

            quickEnableBtn.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              enabledCheckbox.checked = !enabledCheckbox.checked;
              JavaScriptInjectorConfig.updatePluginScriptEnabled(
                script.Id,
                enabledCheckbox.checked
              );
              updateQuickEnableIcon();
            });

            quickExportBtn.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              JavaScriptInjectorConfig.downloadTextFile(
                JavaScriptInjectorConfig.slugifyFilename(script.Name),
                codeTextarea.value,
                "text/javascript"
              );
            });

            quickRemoveBtn.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              if (
                confirm(
                  "Are you sure you want to delete the plugin script \"" + script.Name + "\" from \"" + script.PluginName + "\"?"
                )
              ) {
                JavaScriptInjectorConfig.deletePluginScript(script.Id, detailsElement);
              }
            });

            removeBtn.addEventListener("click", () => {
              if (
                confirm(
                  "Are you sure you want to delete the plugin script \"" + script.Name + "\" from \"" + script.PluginName + "\"?"
                )
              ) {
                JavaScriptInjectorConfig.deletePluginScript(script.Id, detailsElement);
              }
            });

            // Handle arrow icon switching on toggle
            detailsElement.addEventListener("toggle", () => {
              arrowIcon.style.transform = detailsElement.open ? "rotate(90deg)" : "rotate(0deg)";
            });

            return clone;
          },

          saveConfiguration: function () {
            Dashboard.showLoadingMsg();
            const scripts = [];
            let changedScriptCount = 0;
            const changedScriptNames = [];
            // Only save user scripts, not plugin scripts
            document
              .querySelectorAll("#scriptsContainer .script-container")
              .forEach((container) => {
                const nameInput = container.querySelector(".script-name-input");
                const scriptTextarea = container.querySelector(".script-code-textarea");
                const originalName = nameInput.value;
                const originalScript = scriptTextarea.value;
                const name = JavaScriptInjectorConfig.sanitizeForXml(originalName);
                const script = JavaScriptInjectorConfig.sanitizeForXml(originalScript);
                const enabled = container.querySelector(".script-enabled-checkbox").checked;
                const requiresAuthentication =
                  container.querySelector(".script-auth-checkbox").checked;

                if (name !== originalName || script !== originalScript) {
                  changedScriptCount += 1;
                  changedScriptNames.push((name || originalName || "Unnamed Script").trim());
                  nameInput.value = name;
                  scriptTextarea.value = script;
                }

                scripts.push({
                  Name: name,
                  Script: script,
                  Enabled: enabled,
                  RequiresAuthentication: requiresAuthentication,
                });
              });

            JavaScriptInjectorConfig.showSanitizeNotice(changedScriptCount, changedScriptNames);

            ApiClient.getPluginConfiguration(JavaScriptInjectorConfig.pluginId).then(function (
              config
            ) {
              config.CustomJavaScripts = scripts;
              // Don't modify PluginJavaScripts array here
              ApiClient.updatePluginConfiguration(JavaScriptInjectorConfig.pluginId, config).then(
                function (result) {
                  JavaScriptInjectorConfig.isDirty = false;
                  Dashboard.processPluginConfigurationUpdateResult(result);
                }
              );
            });
          },

          collectUserScripts: function () {
            const scripts = [];
            document
              .querySelectorAll("#scriptsContainer .script-container")
              .forEach((container) => {
                scripts.push({
                  Name: container.querySelector(".script-name-input").value,
                  Script: container.querySelector(".script-code-textarea").value,
                  Enabled: container.querySelector(".script-enabled-checkbox").checked,
                  RequiresAuthentication: container.querySelector(".script-auth-checkbox").checked,
                });
              });
            return scripts;
          },

          exportAllScripts: function () {
            const scripts = JavaScriptInjectorConfig.collectUserScripts();
            const payload = { CustomJavaScripts: scripts };
            const timestamp = new Date().toISOString().slice(0, 10);
            JavaScriptInjectorConfig.downloadTextFile(
              "jellyfin-javascript-injector-scripts-" + timestamp + ".json",
              JSON.stringify(payload, null, 2),
              "application/json"
            );
          },

          importScripts: function (file) {
            const reader = new FileReader();
            reader.onload = function () {
              let parsed;
              try {
                parsed = JSON.parse(reader.result);
              } catch (err) {
                alert("Import failed: the selected file is not valid JSON.");
                return;
              }

              const scripts = Array.isArray(parsed)
                ? parsed
                : Array.isArray(parsed.CustomJavaScripts)
                ? parsed.CustomJavaScripts
                : null;

              if (!scripts) {
                alert(
                  "Import failed: expected a JSON array of scripts or an object with a CustomJavaScripts array."
                );
                return;
              }

              const valid = scripts.filter((s) => s && typeof s.Script === "string");
              if (valid.length === 0) {
                alert("Import failed: no valid script entries were found in the file.");
                return;
              }

              const existingNames = new Set(
                Array.from(document.querySelectorAll("#scriptsContainer .script-name-input"))
                  .map((input) => input.value.trim().toLowerCase())
                  .filter((name) => !!name)
              );
              const duplicates = valid.filter((s) =>
                existingNames.has((s.Name || "").trim().toLowerCase())
              );
              const nonDuplicates = valid.filter((s) => !duplicates.includes(s));

              let toImport = valid;
              if (duplicates.length > 0) {
                const duplicateNames = [...new Set(duplicates.map((s) => s.Name || "Unnamed Script"))].join(
                  ", "
                );
                const importDuplicates = confirm(
                  "The following scripts already exist: " +
                    duplicateNames +
                    ".\n\nImport them anyway as duplicates? Click Cancel to import only the " +
                    nonDuplicates.length +
                    " new script" + (nonDuplicates.length === 1 ? "" : "s") + "."
                );
                toImport = importDuplicates ? valid : nonDuplicates;
              } else if (
                !confirm(
                  "Import " + valid.length + " script" + (valid.length === 1 ? "" : "s") +
                    " and add to your existing list?"
                )
              ) {
                return;
              }

              if (toImport.length === 0) {
                return;
              }

              const scriptsContainer = document.querySelector("#scriptsContainer");
              toImport.forEach((s) => {
                scriptsContainer.appendChild(
                  JavaScriptInjectorConfig.createScriptEntry({
                    Name: s.Name || "Imported Script",
                    Script: s.Script,
                    Enabled: typeof s.Enabled === "boolean" ? s.Enabled : true,
                    RequiresAuthentication: !!s.RequiresAuthentication,
                  })
                );
              });

              JavaScriptInjectorConfig.markDirty();
              JavaScriptInjectorConfig.filterScripts();
            };
            reader.readAsText(file);
          },

          updatePluginScriptEnabled: function (scriptId, enabled) {
            ApiClient.getPluginConfiguration(JavaScriptInjectorConfig.pluginId).then(function (
              config
            ) {
              const script = config.PluginJavaScripts.find((s) => s.Id === scriptId);
              if (script) {
                script.Enabled = enabled;
                ApiClient.updatePluginConfiguration(JavaScriptInjectorConfig.pluginId, config).then(
                  function () {
                    // Silently update without showing success message
                  }
                );
              }
            });
          },

          deletePluginScript: function (scriptId, detailsElement) {
            ApiClient.getPluginConfiguration(JavaScriptInjectorConfig.pluginId).then(function (
              config
            ) {
              const scriptIndex = config.PluginJavaScripts.findIndex((s) => s.Id === scriptId);
              if (scriptIndex !== -1) {
                config.PluginJavaScripts.splice(scriptIndex, 1);
                ApiClient.updatePluginConfiguration(JavaScriptInjectorConfig.pluginId, config).then(
                  function () {
                    detailsElement.remove();
                    // Hide plugin section if no more plugin scripts
                    if (config.PluginJavaScripts.length === 0) {
                      document.querySelector("#pluginScriptsSection").style.display = "none";
                    }
                  }
                );
              }
            });
          },

          eventsRegistered: false,

          registerEvents: function () {
            if (JavaScriptInjectorConfig.eventsRegistered) {
              return;
            }
            JavaScriptInjectorConfig.eventsRegistered = true;

            document
              .querySelector("#JavaScriptInjectorConfigForm")
              .addEventListener("submit", function (e) {
                e.preventDefault();
                JavaScriptInjectorConfig.saveConfiguration();
                return false;
              });

            document.querySelector("#addScriptBtn").addEventListener("click", function () {
              const scriptsContainer = document.querySelector("#scriptsContainer");
              const entry = JavaScriptInjectorConfig.createScriptEntry({
                Name: "New Script",
                Script: "",
                Enabled: true,
                RequiresAuthentication: false,
              });
              scriptsContainer.appendChild(entry);

              const newDetails = scriptsContainer.querySelector("details:last-of-type");
              newDetails.open = true;
              newDetails.scrollIntoView({ behavior: "smooth", block: "center" });
              const newNameInput = newDetails.querySelector(".script-name-input");
              newNameInput.focus();
              newNameInput.select();

              JavaScriptInjectorConfig.markDirty();
              JavaScriptInjectorConfig.updateEmptyState();
            });

            document.querySelector("#scriptSearchInput").addEventListener("input", function () {
              JavaScriptInjectorConfig.filterScripts();
            });

            document.querySelector("#exportScriptsBtn").addEventListener("click", function () {
              JavaScriptInjectorConfig.exportAllScripts();
            });

            const importFileInput = document.querySelector("#importScriptsFile");
            document.querySelector("#importScriptsBtn").addEventListener("click", function () {
              importFileInput.value = "";
              importFileInput.click();
            });
            importFileInput.addEventListener("change", function (e) {
              if (e.target.files && e.target.files[0]) {
                JavaScriptInjectorConfig.importScripts(e.target.files[0]);
              }
            });

            const scriptsContainer = document.querySelector("#scriptsContainer");
            scriptsContainer.addEventListener("dragover", function (e) {
              if (!JavaScriptInjectorConfig.draggedElement) {
                return;
              }
              e.preventDefault();
              const afterElement = JavaScriptInjectorConfig.getDragAfterElement(
                scriptsContainer,
                e.clientY
              );
              if (afterElement == null) {
                scriptsContainer.appendChild(JavaScriptInjectorConfig.draggedElement);
              } else {
                scriptsContainer.insertBefore(JavaScriptInjectorConfig.draggedElement, afterElement);
              }
            });
            scriptsContainer.addEventListener("drop", function (e) {
              if (JavaScriptInjectorConfig.draggedElement) {
                e.preventDefault();
                JavaScriptInjectorConfig.markDirty();
              }
            });

            window.addEventListener("beforeunload", function (e) {
              if (JavaScriptInjectorConfig.isDirty) {
                e.preventDefault();
                e.returnValue = "";
                return "";
              }
            });
          },
        };

        document.addEventListener("pageshow", function (e) {
          if (e.target.id === "JavaScriptInjectorConfigPage") {
            JavaScriptInjectorConfig.loadConfiguration();
            JavaScriptInjectorConfig.registerEvents();
          }
        });
      </script>
    </div>
  </body>
</html>
